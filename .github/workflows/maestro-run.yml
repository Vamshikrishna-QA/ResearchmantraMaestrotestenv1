name: Execute Maestro Mobile Tests

on:
  repository_dispatch:
    types: [run-maestro-tests]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  maestro-mobile-tests:
    # macOS-13 is Intel-based, supporting x86_64 emulator hardware acceleration. 
    # (macos-latest is Apple Silicon / M1 which requires arm64 images)
    runs-on: macos-13
    env:
      SUITE_FILE: maestro-e2e-automation/master_suite.yaml
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: 'true'

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Run Tests on Android Emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_5
          script: |
            # Install the APK on the emulator
            echo "Installing APK..."
            adb install app-release.apk
            
            # Create artifact directories
            mkdir -p build/reports
            mkdir -p build/artifacts

            # Run the Maestro test suite
            echo "Running Maestro tests..."
            maestro test --format junit --output build/reports/junit-report.xml --test-output-dir build/artifacts "$SUITE_FILE"

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-artifacts
          path: |
            build/reports/**
            build/artifacts/**
