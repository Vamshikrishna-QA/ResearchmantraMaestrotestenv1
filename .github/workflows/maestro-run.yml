name: Execute Maestro Mobile Tests

on:
  repository_dispatch:
    types: [run-maestro-tests]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  maestro-mobile-tests:
    # ubuntu-latest supports KVM hardware acceleration for x86_64 Android emulators
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUITE_FILE: maestro-e2e-automation/master_suite.yaml
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: 'true'

      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-rules.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Download APK from Dev Run (if dispatched)
        if: github.event_name == 'repository_dispatch' && github.event.client_payload.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: app-release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.client_payload.run_id }}
          repository: ${{ github.event.client_payload.repo }}
        continue-on-error: true

      - name: Run Tests on Android Emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            export PATH="$HOME/.maestro/bin:$PATH"
            
            echo "Waiting for device..."
            adb wait-for-device
            
            echo "Installing APK with runtime permissions..."
            adb install -r -g app-release.apk
            
            # Create artifact directories
            mkdir -p build/reports
            mkdir -p build/artifacts

            # Run the Maestro test suite
            echo "Running Maestro tests..."
            maestro test --format junit --output build/reports/junit-report.xml --test-output-dir build/artifacts "$SUITE_FILE"

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-artifacts
          path: |
            build/reports/**
            build/artifacts/**

