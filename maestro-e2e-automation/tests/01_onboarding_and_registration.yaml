appId: com.research_mantra_official
---
# ------------------------------------------------------------------------------
# 1. APP LAUNCH & SPLASH SCREEN
# ------------------------------------------------------------------------------
- launchApp:
    clearState: true
- waitForAnimationToEnd

- runFlow:
    when:
      visible: ".*Allow Research Mantra to send you notifications.*|Allow"
    commands:
      - tapOn: "Allow"
      - waitForAnimationToEnd

- scrollUntilVisible:
    element: "Continue"
    direction: DOWN
    timeout: 15000
- assertVisible: "Continue"

- tapOn: "Continue"
- waitForAnimationToEnd

# ------------------------------------------------------------------------------
# 2. SIGN IN SCREEN & RANDOM MOBILE ENTRY
# ------------------------------------------------------------------------------
- scrollUntilVisible:
    element: "Sign in"
    direction: DOWN
- assertVisible: "Sign in"

- scrollUntilVisible:
    element: "Mobile number"
    direction: DOWN
- assertVisible: "Mobile number"

- scrollUntilVisible:
    element: ".*\\+91.*"
    direction: DOWN
- assertVisible: ".*\\+91.*"

- scrollUntilVisible:
    element: "Enter WhatsApp number"
    direction: DOWN
- assertVisible: "Enter WhatsApp number"

- scrollUntilVisible:
    element: ".*By proceeding up,you are agreeing to our.*"
    direction: DOWN
- assertVisible: ".*By proceeding up,you are agreeing to our.*"

- tapOn: "Enter WhatsApp number"
- inputRandomNumber:
    length: 10
- waitForAnimationToEnd

- scrollUntilVisible:
    element: ".*Continue with Mobile Number.*"
    direction: DOWN
    timeout: 8000
- assertVisible: ".*Continue with Mobile Number.*"
- tapOn: ".*Continue with Mobile Number.*"
- waitForAnimationToEnd

# ------------------------------------------------------------------------------
# 3. OTP VERIFICATION (STAGING OTP: 123456)
# ------------------------------------------------------------------------------
- scrollUntilVisible:
    element: "Enter your Verification Code"
    direction: DOWN
    timeout: 15000
- assertVisible: "Enter your Verification Code"

- scrollUntilVisible:
    element: ".*Otp sent to your whatsapp number.*"
    direction: DOWN
- assertVisible: ".*Otp sent to your whatsapp number.*"

- scrollUntilVisible:
    element: "Not you? Change Number"
    direction: DOWN
- assertVisible: "Not you? Change Number"

- scrollUntilVisible:
    element: "Resend Code"
    direction: DOWN
- assertVisible: "Resend Code"

- inputText: "123456"
- waitForAnimationToEnd

- scrollUntilVisible:
    element: "Verify otp"
    direction: DOWN
- assertVisible: "Verify otp"
- tapOn: "Verify otp"
- waitForAnimationToEnd

# ------------------------------------------------------------------------------
# 4. REGISTRATION FORM ENTRY
# ------------------------------------------------------------------------------
- scrollUntilVisible:
    element: "Full Name *"
    direction: DOWN
    timeout: 15000
- assertVisible: "Full Name *"

- scrollUntilVisible:
    element: "Enter Your Name"
    direction: DOWN
- assertVisible: "Enter Your Name"
- tapOn: "Enter Your Name"
- inputRandomPersonName
- waitForAnimationToEnd

- scrollUntilVisible:
    element: "Email Id *"
    direction: DOWN
- assertVisible: "Email Id *"

- scrollUntilVisible:
    element: "Enter Email Id"
    direction: DOWN
- assertVisible: "Enter Email Id"
- tapOn: "Enter Email Id"
- inputRandomEmail
- waitForAnimationToEnd

- scrollUntilVisible:
    element: "Mobile"
    direction: DOWN
- assertVisible: "Mobile"

- scrollUntilVisible:
    element: "City *"
    direction: DOWN
- assertVisible: "City *"

- scrollUntilVisible:
    element: "Current City"
    direction: DOWN
- assertVisible: "Current City"
- tapOn: "Current City"
- inputRandomText:
    length: 8
- waitForAnimationToEnd

- scrollUntilVisible:
    element: "Gender *"
    direction: DOWN
- assertVisible: "Gender *"

- scrollUntilVisible:
    element: "Male"
    direction: DOWN
- assertVisible: "Male"

- scrollUntilVisible:
    element: "Female"
    direction: DOWN
- assertVisible: "Female"
- tapOn: "Male"
- waitForAnimationToEnd

- scrollUntilVisible:
    element: "Register"
    direction: DOWN
- assertVisible: "Register"
- tapOn: "Register"
- waitForAnimationToEnd

# ------------------------------------------------------------------------------
# 5. DASHBOARD SEBI NOTICE & FREE GIFT PROMPT
# ------------------------------------------------------------------------------
- scrollUntilVisible:
    element: "Important Notice"
    direction: DOWN
    timeout: 15000
- assertVisible: "Important Notice"

- scrollUntilVisible:
    element: ".*Susmita Sahoo.*|.*Registration Number.*"
    direction: DOWN
- assertVisible: ".*Susmita Sahoo.*|.*Registration Number.*"

- scrollUntilVisible:
    element: "Risk Disclosures on Derivatives"
    direction: DOWN
- assertVisible: "Risk Disclosures on Derivatives"

- scrollUntilVisible:
    element: "I Understand"
    direction: DOWN
- assertVisible: "I Understand"

- tapOn: "I Understand"
- waitForAnimationToEnd

# Non-invasive assertion of Free Trial Gift bottom sheet
- scrollUntilVisible:
    element: "ACTIVATE"
    direction: DOWN
    timeout: 10000
- assertVisible: "ACTIVATE"

# Dismiss sheet to preserve fresh user state
- back
- waitForAnimationToEnd
# ------------------------------------------------------------------------------
# 8. DASHBOARD BOTTOM NAVIGATION CONFIRMATION
# ------------------------------------------------------------------------------
- scrollUntilVisible:
    element: "Explore"
- assertVisible: "Explore"
- scrollUntilVisible:
    element: "Trades"
- assertVisible: "Trades"
- scrollUntilVisible:
    element: "Calc"
- assertVisible: "Calc"
- scrollUntilVisible:
    element: "Profile"
- assertVisible: "Profile"


# ------------------------------------------------------------------------------
# 6. PROFILE DETAILS & MOBILE NUMBER EDIT CHECK
# ------------------------------------------------------------------------------
- scrollUntilVisible:
    element: ".*Open profile details.*"
    direction: UP
    timeout: 10000
- assertVisible: ".*Open profile details.*"
- tapOn: ".*Open profile details.*"
- waitForAnimationToEnd

- scrollUntilVisible:
    element: "Personal Details"
    direction: DOWN
    timeout: 10000
- assertVisible: "Personal Details"
- scrollUntilVisible:
    element: "Full Name *"
- assertVisible: "Full Name *"

- inputRandomPersonName



- scrollUntilVisible:
    element: "Date of Birth *"
    direction: DOWN
- assertVisible: "Date of Birth *"

- scrollUntilVisible:
    element: "Verified"
    direction: DOWN
- assertVisible: "Verified"

- scrollUntilVisible:
    element: "Edit"
    direction: DOWN
- assertVisible: "Edit"
- tapOn: "Edit"
- waitForAnimationToEnd

- scrollUntilVisible:
    element: "Change Mobile Number"
    direction: DOWN
- assertVisible: "Change Mobile Number"

# Tap Change Mobile Number submission button
- scrollUntilVisible:
    element:
      text: "Change Mobile Number"
      index: 1
    direction: DOWN
- assertVisible:
    text: "Change Mobile Number"
    index: 1
- tapOn:
    text: "Change Mobile Number"
    index: 1
- waitForAnimationToEnd

# Assert validation message for duplicate entry
- scrollUntilVisible:
    element: "You are already using this mobile number."
    direction: DOWN
- assertVisible: "You are already using this mobile number."

# Return to Profile and Save
- back
- waitForAnimationToEnd

- scrollUntilVisible:
    element: "Update"
    direction: DOWN
- assertVisible: "Update"
- tapOn: "Update"
- waitForAnimationToEnd

- back
- waitForAnimationToEnd