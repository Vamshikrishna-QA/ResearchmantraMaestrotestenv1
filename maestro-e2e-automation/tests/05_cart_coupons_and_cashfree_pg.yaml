appId: com.research_mantra_official
---
# ==========================================
# FLOW 1: 100% FREE COUPON (BYPASS CASHFREE)
# ==========================================
# 1. Product Selection: Research Report
- tapOn: ".*Trades.*"
- waitForAnimationToEnd
- tapOn: ".*Services.*"
- waitForAnimationToEnd

- scrollUntilVisible:
    element: ".*RESEARCH REPORT.*"
    direction: DOWN
    timeout: 10000

- tapOn: ".*RESEARCH REPORT.*"
- waitForAnimationToEnd

- assertVisible: ".*Research Report.*"
- assertVisible: ".*Premium Research.*"
- tapOn: ".*Add [tT]o Cart.*"
- waitForAnimationToEnd

# 2. Open Cart from Top Bar Icon
- tapOn:
    point: "76%, 8%"
- waitForAnimationToEnd

- assertVisible: ".*Cart.*"
- assertVisible: ".*Research Report.*"

# 3. Apply 100% Promo Coupon (GETFREE)
- tapOn: ".*View Coupon.*"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: ".*Have a coupon code\\?.*"
    timeout: 10000

- tapOn:
    text: ".*Apply.*"
    index: 1
- waitForAnimationToEnd

- assertVisible: ".*Coupon \"GETFREE\" applied.*"
- assertVisible: ".*₹0.00.*"

# 4. Trigger Duration Picker
- tapOn: ".*Activate Now.*"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: ".*Choose Duration.*"
    timeout: 10000

- tapOn: ".*GET FREE.*"
- waitForAnimationToEnd

# 5. SEBI Client Declaration & Risk Disclosure Agreement
- extendedWaitUntil:
    visible: ".*Client Declaration & Risk Disclosure Agreement.*"
    timeout: 10000

- tapOn: ".*I have read, understood, and agree to the above Client Declaration & Risk Disclosure Agreement.*"
- waitForAnimationToEnd

- tapOn: ".*Proceed to Payment.*"
- waitForAnimationToEnd

# 6. Verify Bypassed Payment (Toast & Empty Cart)
- extendedWaitUntil:
    visible: ".*Product added successfully.*"
    timeout: 15000

- assertVisible: ".*Your cart is empty.*"

- back
- waitForAnimationToEnd
- back
- waitForAnimationToEnd


# ==========================================
# FLOW 2: PAID CASHFREE SIMULATOR
# ==========================================
# 1. Product Selection: Dhan Setu Index
- tapOn: ".*Trades.*"
- waitForAnimationToEnd
- tapOn: ".*Services.*"
- waitForAnimationToEnd

- scrollUntilVisible:
    element: ".*DHAN SETU INDEX PLAN.*"
    direction: DOWN
    timeout: 10000

- tapOn: ".*DHAN SETU INDEX PLAN.*"
- waitForAnimationToEnd

- tapOn: ".*Add [tT]o Cart.*"
- waitForAnimationToEnd

# 2. Open Cart
- tapOn:
    point: "76%, 8%"
- waitForAnimationToEnd

- assertVisible: ".*Cart.*"
- assertVisible: ".*Dhan Setu Index.*"
- assertVisible: ".*₹999.00.*"

# 3. Trigger Duration Picker (No Coupon Applied)
- tapOn: ".*Activate Now.*"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: ".*Choose Duration.*"
    timeout: 10000

- tapOn: ".*Yearly Plan.*"
- waitForAnimationToEnd

- tapOn: ".*Ready to pay.*"
- waitForAnimationToEnd

# 4. SEBI Client Declaration
- extendedWaitUntil:
    visible: ".*Client Declaration & Risk Disclosure Agreement.*"
    timeout: 10000

- tapOn: ".*I have read, understood, and agree to the above Client Declaration & Risk Disclosure Agreement.*"
- waitForAnimationToEnd

- tapOn: ".*Proceed to Payment.*"
- waitForAnimationToEnd

# 5. Cashfree NetBanking Simulation
- extendedWaitUntil:
    visible: ".*Proceed to pay.*|.*Payment Page.*"
    timeout: 20000

- tapOn: ".*Proceed to pay.*"
- waitForAnimationToEnd

- scrollUntilVisible:
    element: ".*Net Banking.*"
    direction: DOWN
    timeout: 10000
- tapOn: ".*Net Banking.*"
- waitForAnimationToEnd

- scrollUntilVisible:
    element: ".*State Bank Of India.*"
    direction: DOWN
    timeout: 10000
- tapOn: ".*State Bank Of India.*"
- waitForAnimationToEnd

- tapOn: ".*Proceed to Pay.*"
- waitForAnimationToEnd

# Enter Sandbox Gateway OTP: 111000
- extendedWaitUntil:
    visible: ".*OTP.*"
    timeout: 15000

- tapOn: ".*OTP.*"
- inputText: "111000"
- hideKeyboard
- waitForAnimationToEnd

- tapOn: ".*SUCCESS.*"
- waitForAnimationToEnd

- tapOn: ".*Submit.*"
- waitForAnimationToEnd

# 6. Payment Confirmation Verification
- extendedWaitUntil:
    visible: ".*Payment Successful!.*"
    timeout: 25000

- assertVisible: ".*Order Summary.*"
- assertVisible: ".*SUCCESS.*"

- tapOn: ".*Continue.*"
- waitForAnimationToEnd

- runFlow:
    file: ../flows/reset_to_explore.yaml
